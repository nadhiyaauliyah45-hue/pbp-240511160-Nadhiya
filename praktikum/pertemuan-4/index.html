<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Dekorasi latar: lingkaran -->
  <span class="bulat c1" aria-hidden="true"></span>
  <span class="bulat c2" aria-hidden="true"></span>
  <span class="bulat c3" aria-hidden="true"></span>
  <span class="bulat c4" aria-hidden="true"></span>

  <!-- Dekorasi latar: gelombang coklat -->
  <svg class="wave w-tl" viewBox="0 0 260 180" aria-hidden="true"><path d="M0 0H210C160 40 130 30 95 82C60 134 22 120 0 172Z" fill="#D2A67C"/></svg>
  <svg class="wave w-tr" viewBox="0 0 320 140" aria-hidden="true"><path d="M320 0V118C262 108 250 52 192 46C142 40 112 14 92 0Z" fill="#8B5330"/><path d="M320 96C270 92 256 40 200 34" fill="none" stroke="#D2A67C" stroke-width="2"/></svg>
  <svg class="wave w-bottom" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70C200 20 400 110 600 60C800 10 1000 80 1200 40V160H0Z" fill="#E7C9A6"/><path d="M0 112C250 72 450 142 700 102C900 72 1050 122 1200 92V160H0Z" fill="#7A4A2B"/></svg>

  <!-- Tanaman -->
  <svg class="plant" viewBox="0 0 100 120" aria-hidden="true">
    <g fill="#8C8B5C" stroke="#7A4A2B" stroke-width="2.5" stroke-linejoin="round">
      <ellipse cx="36" cy="40" rx="13" ry="26" transform="rotate(-28 36 40)"/>
      <ellipse cx="64" cy="44" rx="12" ry="24" transform="rotate(30 64 44)"/>
      <ellipse cx="50" cy="28" rx="11" ry="24"/>
    </g>
    <path d="M50 76V40M44 74L36 48M56 74L64 52" stroke="#7A4A2B" stroke-width="2" fill="none"/>
    <path d="M20 76h60l-6 36H26z" fill="#FFF0DD" stroke="#7A4A2B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 100s-12-7-12-14a6 6 0 0112-3 6 6 0 0112 3c0 7-12 14-12 14z" fill="#B07A55"/>
  </svg>

  <main class="app">
    <header class="judul">
      <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
        <g stroke="#7A4A2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <g transform="rotate(-8 45 61)">
            <rect x="14" y="20" width="62" height="82" rx="10" fill="#FFF4E8"/>
            <rect x="32" y="10" width="26" height="14" rx="5" fill="#7A4A2B"/>
            <path d="M28 44l4 4 7-8M46 42h22M28 62l4 4 7-8M46 60h22M28 80l4 4 7-8M46 78h14" fill="none" stroke-width="4"/>
          </g>
          <circle cx="80" cy="82" r="24" fill="#FFF4E8"/>
          <path d="M80 68v14l8 5M75 56h10" fill="none"/>
        </g>
      </svg>
      <div class="teks-judul">
        <h1>To-Do List</h1>
        <svg class="garis-judul" viewBox="0 0 300 12" aria-hidden="true"><path d="M2 8c40-8 80 4 120-2s90-6 176 0" fill="none" stroke="#A8693F" stroke-width="3" stroke-linecap="round"/></svg>
        <p class="sub">Catat, selesaikan, dan rayakan setiap langkah kecil.</p>
      </div>
      <svg class="kilau k1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 5 3 7 8 8-5 1-7 3-8 8-1-5-3-7-8-8 5-1 7-3 8-8z" fill="#D2A67C"/></svg>
      <svg class="kilau k2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 5 3 7 8 8-5 1-7 3-8 8-1-5-3-7-8-8 5-1 7-3 8-8z" fill="#B07A55"/></svg>
    </header>

    <form id="form-todo" novalidate>
      <div class="kolom-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4" fill="none" stroke="#A8693F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="text" id="input-todo" placeholder="Tulis tugas baru..." maxlength="120" autocomplete="off" aria-label="Tugas baru">
      </div>
      <button type="submit" class="tambah">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
        Tambah
      </button>
    </form>
    <p id="error" role="alert"></p>

    <div class="status">
      <p id="stats" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#7A4A2B"/><path d="M7 12.5l3.5 3.5L17 9" stroke="#fff" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="teks-stats">0 tugas belum selesai</span>
      </p>
      <div class="track" aria-hidden="true">
        <div id="bar"></div>
        <svg id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.500-8 11-8 11z" fill="#FFF6EC" stroke="#A8693F" stroke-width="2"/></svg>
      </div>
      <span id="persen">0%</span>
    </div>

    <ul id="list-todo"></ul>
    <p id="selamat" hidden>🎉 Semua tugas selesai! Kerja bagus.</p>
  </main>
  <script src="app.js?v=3"></script>
</body>
</html>
